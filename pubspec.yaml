name: masrouf_v2
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

# environment:
#   sdk: ">=3.2.0 <4.0.0"

environment:
  sdk: ^3.10.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  pdf: ^3.11.1
  printing: ^5.13.1
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  fl_chart: ^0.70.2

  # State Management & DI
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Database
  drift: ^2.24.0
  drift_flutter: ^0.2.2
  sqlite3_flutter_libs: ^0.5.28

  # Data Classes
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Settings
  shared_preferences: ^2.3.5
  uuid: ^4.6.0
  file_picker: ^11.0.3
  crypto: ^3.0.7
  home_widget: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.15
  drift_dev: ^2.24.0
  riverpod_generator: ^2.6.3
  freezed: ^2.5.8
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Cairo-Light.ttf
          weight: 300
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-Black.ttf
          weight: 900
